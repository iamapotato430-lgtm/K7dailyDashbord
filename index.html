<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>KE7 Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: console top bar → range heading → six metric cards in an even grid (1 / 2 / 3 cols) → collapsible daily table → source note */
:root{
  color-scheme: dark;
  --bg:#0f1115;
  --panel:#171a1f;
  --raised:#1e2228;
  --selected:#2b3039;
  --line:#2a2f37;
  --grid:#22262d;
  --tip:#0b0d10;
  --ink:#e8eaed;
  --ink-2:#a1a7b0;
  --ink-3:#6b7280;
  --amber:#f4b740;
  --amber-deep:#d99a1e;
  --amber-ink:#1b1406;
  --amber-soft:rgba(244,183,64,.12);
  --teal:#3ccf9d;
  --teal-soft:rgba(60,207,157,.12);
  --sky:#7aa7f7;
  --red:#ef5b5b;
  --shadow:rgba(0,0,0,.45);
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1560px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:8px 48px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding-block:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{flex:none;width:42px;height:42px;border-radius:11px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font:700 15px/1 var(--font-num);letter-spacing:-.02em;box-shadow:inset 0 -2px 0 var(--amber-deep)}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.02em}
.brand .sub{display:block;font:500 11px/1.4 var(--font-num);letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dates{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.dp{display:inline-flex;align-items:center;gap:6px}
.dp .dl{font-size:12px;color:var(--ink-3)}
.dp select{appearance:none;-webkit-appearance:none;background:var(--raised) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238b93a1' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 8px center;border:1px solid var(--line);border-radius:9px;padding:6px 24px 6px 10px;font:500 13px/1.2 var(--font-num);color:var(--ink);color-scheme:dark;min-width:0;cursor:pointer}
.dp.on select{border-color:var(--amber-deep)}
.dp select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ctl-label{font-size:12px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;cursor:pointer;padding:6px 12px;border-radius:7px;font:500 13px/1.2 var(--font-ui);color:var(--ink-2)}
.seg button .n{font-family:var(--font-num)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--selected);color:var(--ink)}
.seg button:focus-visible,.btn:focus-visible,.chart:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.status{display:inline-flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:500 12px/1.2 var(--font-num);color:var(--ink-2);white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.status[data-state="live"] .dot{background:var(--teal)}
.status[data-state="snapshot"] .dot{background:var(--amber)}
.status[data-state="loading"] .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.btn{appearance:none;cursor:pointer;background:transparent;color:var(--amber);border:1px solid var(--amber-deep);border-radius:9px;padding:6px 12px;font:500 13px/1.2 var(--font-ui)}
.btn:hover{background:var(--amber-soft)}
.btn[disabled]{opacity:.5;cursor:default}

/* heading */
.intro{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;padding-block:24px 18px}
.eyebrow{font:500 12px/1.4 var(--font-num);letter-spacing:.08em;color:var(--ink-3)}
.intro h2{margin:4px 0 0;font-size:26px;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.intro h2 small{font-size:15px;font-weight:400;color:var(--ink-2);margin-left:14px;letter-spacing:0}
.span-pill{font:500 12px/1 var(--font-num);color:var(--ink-2);background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:8px 12px;white-space:nowrap}

/* cards */
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1500px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px 12px;display:flex;flex-direction:column;gap:6px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.metric-name{font-size:15px;font-weight:500;color:var(--ink)}
.metric-src{display:block;font:400 11.5px/1.5 var(--font-num);color:var(--ink-3)}
.tag{flex:none;font-size:12px;line-height:1;padding:5px 9px;border-radius:7px}
.tag.user{color:var(--teal);background:var(--teal-soft)}
.tag.money{color:var(--amber);background:var(--amber-soft)}
.value-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-top:6px}
.value{font:600 clamp(24px,2.3vw,31px)/1.1 var(--font-num);letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
.asof{font:400 12px var(--font-num);color:var(--ink-3)}
.value-row.vpair{align-items:flex-end;gap:6px 28px}
.vblock{display:flex;flex-direction:column;gap:2px}
.vlabel{font:400 12px var(--font-ui);color:var(--ink-3)}
.vlabel .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.tip .row b{margin-left:auto;padding-left:16px;font-weight:600}
.compare{font:400 12.5px/1.5 var(--font-num);color:var(--ink-2);font-variant-numeric:tabular-nums}
.compare .g{font-weight:600}
.up{color:var(--teal)}
.down{color:var(--red)}
.chart{position:relative;height:214px;margin-top:6px;border-radius:8px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.gl{stroke:var(--grid);stroke-width:1}
.zero{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 4}
.ax{fill:var(--ink-3);font:400 11px var(--font-num)}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
.gap{fill:var(--grid);opacity:.55}
.tip{position:absolute;top:6px;left:0;z-index:3;pointer-events:none;background:var(--tip);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:400 12.5px/1.6 var(--font-num);color:var(--ink);white-space:nowrap;box-shadow:0 10px 28px var(--shadow);font-variant-numeric:tabular-nums}
.tip .d{color:var(--ink-2);font-size:12px}
.tip .row{display:flex;align-items:center;gap:8px}
.tip .sw{width:9px;height:9px;border-radius:2px;flex:none}
.tip .k{color:var(--ink-2)}
.tip .muted{color:var(--ink-3);font-size:11.5px}
/* desktop (B): ~30% backing so the lines show through, text kept legible with a soft outline */
.tip{background:rgba(11,13,16,.28);border-color:rgba(255,255,255,.07);box-shadow:none}
.tip *{text-shadow:0 0 2px var(--tip),0 0 4px var(--tip),0 0 6px var(--tip)}
/* phone (C): smaller box with ~55% backing */
@media (max-width:640px){
  .tip{background:rgba(11,13,16,.55);padding:3px 8px;font-size:11px;line-height:1.45;border-radius:7px}
  .tip .d{font-size:10.5px}
  .tip .sw{width:7px;height:7px}
  .tip .row{gap:6px}
  .tip .row b{padding-left:10px}
  .tip *{text-shadow:0 0 2px var(--tip),0 0 4px var(--tip)}
}

/* table */
.daily{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.daily summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:14px 20px;font-size:15px;font-weight:500}
.daily summary::-webkit-details-marker{display:none}
.daily summary::before{content:"▸";color:var(--amber);font-size:12px;transition:transform .15s}
.daily[open] summary::before{transform:rotate(90deg)}
.daily summary .hint{font:400 12px var(--font-num);color:var(--ink-3)}
.scroll{overflow:auto;max-height:560px;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
th,td{padding:8px 16px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
th{position:sticky;top:0;background:var(--raised);font:500 12px var(--font-ui);color:var(--ink-2);z-index:1}
td{font:400 12.5px var(--font-num);color:var(--ink)}
th:first-child,td:first-child{text-align:left}
td.neg{color:var(--red)}
td.na{color:var(--ink-3)}
tbody tr:hover td{background:var(--raised)}

.note{margin-top:18px;font-size:12.5px;line-height:1.7;color:var(--ink-3);max-width:90ch}
.note b{font-weight:500;color:var(--ink-2)}
.note code{font-family:var(--font-num);font-size:12px;color:var(--ink-2)}

@media (max-width:560px){
  .chart{height:190px}
  .card{padding:16px 16px 10px}
  .intro h2 small{display:block;margin:4px 0 0}
}
@media (prefers-reduced-motion:reduce){
  .status[data-state="loading"] .dot{animation:none}
  .daily summary::before{transition:none}
}
/* ===== 同時在線熱力圖 ===== */
.heat{margin-top:16px;gap:8px}
.tag.sim{color:var(--ink-2);background:transparent;border:1px dashed var(--ink-3)}
.heat-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:6px}
.hseg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.hseg button{appearance:none;border:0;background:transparent;cursor:pointer;padding:6px 12px;border-radius:7px;font:500 13px/1.2 var(--font-ui);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hseg button:hover{color:var(--ink)}
.hseg button[aria-pressed="true"]{background:var(--selected);color:var(--ink)}
.hseg button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hseg .sw{width:8px;height:8px;border-radius:2px}
.heat-desc{font:400 12.5px/1.6 var(--font-ui);color:var(--ink-2)}
.heat-desc .use{color:var(--amber)}
.heat-basis{font:400 12px/1.5 var(--font-num);color:var(--ink-3)}
.heat-sumhd{margin-top:6px;font:500 12px/1.4 var(--font-ui);color:var(--ink-3);letter-spacing:.02em}
.heat-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hs{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.hs .k{display:block;font:400 12px/1.4 var(--font-ui);color:var(--ink-3)}
.hs .v{display:block;font:600 19px/1.35 var(--font-num);color:var(--ink);white-space:nowrap}
.hs .s{display:block;font:400 12px/1.4 var(--font-num);color:var(--ink-2)}
.heat-box{position:relative;margin-top:10px}
.hm{display:grid;grid-template-columns:40px repeat(24,minmax(0,1fr)) 92px;gap:3px}
.hm .hh{font:400 10.5px/1 var(--font-num);color:var(--ink-3);padding-bottom:5px;align-self:end;white-space:nowrap;overflow:visible}
.hm .hl{font:400 12px/1 var(--font-ui);color:var(--ink-3);display:flex;align-items:center}
.hm .hl.best{color:var(--ink);font-weight:500}
.hm .hh.cap{padding-left:8px}
.hm .hc{height:30px;border-radius:4px;cursor:crosshair}
.hm .hc.pk{box-shadow:inset 0 0 0 2px var(--bg)}
.hm .hc.lo{box-shadow:inset 0 0 0 2px var(--ink-2)}
.hm .hc.on{outline:2px solid var(--ink);outline-offset:1px;box-shadow:0 0 0 4px var(--bg);position:relative;z-index:1}
.hm .sd{display:flex;align-items:center;gap:6px;padding-left:8px;min-width:0}
.hm .sd .bw{flex:1;min-width:0}
.hm .sd i{display:block;height:8px;border-radius:2px;min-width:2px;opacity:.4}
.hm .sd.best i{opacity:1}
.hm .sd span.v{flex:none;width:40px;text-align:right;font:400 11px/1 var(--font-num);color:var(--ink-2)}
.hm .sd.best span.v{color:var(--ink);font-weight:600}
.hm .hl.cap{align-items:flex-start;padding-top:10px}
.hm .hcv{grid-column:2 / span 24;height:84px;margin-top:6px;position:relative}
.hm .hcv svg{display:block;width:100%;height:100%;overflow:visible}
.hcv .cl{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.hcv .cg{stroke:var(--grid);stroke-width:1}
.hcv .cv{font:400 10.5px var(--font-num);fill:var(--ink-2)}
.heat-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:400 12px/1.5 var(--font-num);color:var(--ink-3);margin-top:4px}
.heat-legend .sws{display:inline-flex;gap:2px}
.heat-legend .sws i{display:block;width:16px;height:10px;border-radius:2px}
.heat-legend .mk{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 5px 0 12px;vertical-align:-1px}
.heat-legend .hint{font-family:var(--font-ui);margin-left:12px}
.hm .hm-msg{grid-column:1/-1;padding:32px 8px;text-align:center;font:400 13px/1.6 var(--font-ui);color:var(--ink-3)}
.heat-box .htip{background:rgba(11,13,16,.88);border-color:var(--line)}
@media (max-width:640px){
  .heat-sum{grid-template-columns:1fr;gap:6px}
  .hs{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:8px 12px}
  .hs .k{flex-basis:100%}
  .hs .v{font-size:16px}
  .hm{grid-template-columns:30px repeat(24,minmax(0,1fr)) 38px;gap:2px}
  .hm .hc{height:24px;border-radius:3px}
  .hm .hh.x6{visibility:hidden}
  .hm .hh.cap{padding-left:3px;font-size:10px}
  .hm .hl{font-size:11px}
  .hm .sd{padding-left:5px}
  .hm .sd .bw{display:none}
  .hm .sd span.v{width:auto;text-align:left;font-size:10.5px}
  .hm .hcv{height:70px}
  .heat-legend .hint{margin-left:0;flex-basis:100%}
  .heat-legend .mk{margin-left:0}
}
/* ===== 日期區間：單一日曆 ===== */
.rp{position:relative}
.rp-btn{display:inline-flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font:500 13px/1.2 var(--font-num);color:var(--ink);cursor:pointer;white-space:nowrap}
.rp-btn svg{width:15px;height:15px;flex:none;color:var(--ink-2)}
.rp-btn:hover{border-color:var(--ink-3)}
.rp-btn.on{border-color:var(--amber-deep)}
.rp-btn.on svg{color:var(--amber)}
.rp-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.rp-scrim{position:fixed;inset:0;z-index:30;background:transparent}
.rp-pop{position:absolute;top:calc(100% + 8px);left:0;z-index:31;width:308px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 18px 40px var(--shadow)}
.rp-hint{font:500 12.5px/1.4 var(--font-ui);color:var(--amber);margin:0 2px 6px}
.rp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.rp-arw{appearance:none;border:0;background:transparent;color:var(--ink-2);width:34px;height:34px;border-radius:8px;font:400 20px/1 var(--font-ui);cursor:pointer}
.rp-arw:hover:not(:disabled){background:var(--raised);color:var(--ink)}
.rp-arw:disabled{opacity:.25;cursor:default}
.rp-title{appearance:none;border:0;background:transparent;color:var(--ink);font:600 14px/1 var(--font-ui);padding:9px 10px;border-radius:8px;cursor:pointer}
.rp-title:hover{background:var(--raised)}
.rp-title::after{content:"▾";margin-left:6px;color:var(--ink-3);font-size:11px}
.rp-wk,.rp-days{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.rp-wk span{text-align:center;font:400 11.5px/28px var(--font-ui);color:var(--ink-3)}
.rp-days button{appearance:none;border:0;background:transparent;height:36px;padding:0;font:500 13px/1 var(--font-num);color:var(--ink);cursor:pointer;border-radius:0}
.rp-days button:not(.in):not(:disabled):hover{background:var(--raised);border-radius:8px}
.rp-days button:disabled{color:var(--ink-3);opacity:.35;cursor:default}
.rp-days button.in{background:var(--amber-soft)}
.rp-days button.s,.rp-days button.e{background:var(--amber);color:var(--amber-ink);font-weight:700}
.rp-days button.s{border-radius:8px 0 0 8px}
.rp-days button.e{border-radius:0 8px 8px 0}
.rp-days button.s.e{border-radius:8px}
.rp-days button:focus-visible,.rp-months button:focus-visible,.rp-title:focus-visible,.rp-arw:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.rp-months{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 0}
.rp-months button{appearance:none;border:1px solid var(--line);background:var(--raised);color:var(--ink);height:42px;border-radius:9px;font:500 13px var(--font-ui);cursor:pointer}
.rp-months button:hover:not(:disabled){border-color:var(--ink-3)}
.rp-months button.cur{border-color:var(--amber-deep);color:var(--amber)}
.rp-months button:disabled{opacity:.3;cursor:default}
.rp-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.rp-sel{flex:1;min-width:0;font:500 12.5px/1.4 var(--font-num);color:var(--ink-2)}
.rp-cancel{appearance:none;border:0;background:transparent;color:var(--ink-2);font:500 13px/1.2 var(--font-ui);padding:6px 10px;border-radius:8px;cursor:pointer}
.rp-cancel:hover{color:var(--ink);background:var(--raised)}
@media (max-width:640px){
  .rp-scrim{background:rgba(0,0,0,.55)}
  .rp-pop{position:fixed;left:12px !important;right:12px;bottom:12px;top:auto;width:auto;padding:16px}
  .rp-days button{height:42px}
  .rp-sel{flex-basis:100%}
  .rp-cancel{margin-left:auto}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">K7</div>
      <div>
        <h1>KE7 產品數據</h1>
        <span class="sub">Daily Console · 產品總表(日)</span>
      </div>
    </div>
    <div class="controls">
      <div class="ctl">
        <span class="ctl-label" id="range-label">區間</span>
        <div class="seg" role="group" aria-labelledby="range-label">
          <button type="button" id="range-all" data-range="all" aria-pressed="true">1/1 起</button>
          <button type="button" id="range-90" data-range="90" aria-pressed="false"><span class="n">90</span> 日</button>
          <button type="button" id="range-30" data-range="30" aria-pressed="false"><span class="n">30</span> 日</button>
        </div>
        <div class="rp" id="rp">
          <button type="button" class="rp-btn" id="rp-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="rp-pop">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>
            <span id="rp-label">—</span>
          </button>
          <div class="rp-scrim" id="rp-scrim" hidden></div>
          <div class="rp-pop" id="rp-pop" role="dialog" aria-label="選擇日期區間" hidden>
            <div class="rp-hint" id="rp-hint" aria-live="polite"></div>
            <div class="rp-nav">

      i = j;
    }
  }

  // y grid + labels
  ticks.forEach(function(t){
    var y = Y(t);
    el("line", {class: t === 0 && y0 < 0 ? "zero" : "gl", x1:padL, x2:padL + iw, y1:y, y2:y}, svg);
    var lab = el("text", {class:"ax", x:padL - 8, y:y + 4, "text-anchor":"end"}, svg);
    lab.textContent = fmtAxis(m.fmt, t);
  });
  if (R) rTicks.forEach(function(t, k){
    var rl = el("text", {class:"ax", x:padL + iw + 8, y:Y(ticks[k]) + 4, "text-anchor":"start"}, svg);
    rl.textContent = fmtAxis(m.fmt, t);
  });

  // x labels: pick ONE even step (every 1 / 2 / 3 / 4 / 6 / 12 ticks) that fits, so the spacing is regular.
  // Geometry is measured on a nominal plot width (not this chart's own y-axis width) so every card of the
  // same width gets the same step.
  var ticks = xTicks(days);
  var avail = Math.max(120, W - 64);
  function nom(i){ return n > 1 ? avail * i / (n - 1) : 0; }
  var wMax = 0; ticks.forEach(function(tk){ var w = textW(tk.t); if (w > wMax) wMax = w; });
  var need = wMax + 18;
  function fits(k){
    for (var j = 0; j + k < ticks.length; j += k){ if (nom(ticks[j + k].i) - nom(ticks[j].i) < need) return false; }
    return true;
  }
  var ladder = [1, 2, 3, 4, 6, 12], step = ladder[ladder.length - 1];
  for (var q = 0; q < ladder.length; q++){ if (fits(ladder[q])){ step = ladder[q]; break; } }
  for (var j = 0; ; j++){
    var idx = ticks.fromEnd ? ticks.length - 1 - j * step : j * step;
    if (idx < 0 || idx >= ticks.length) break;
    var tk = ticks[idx], x = X(tk.i), w = textW(tk.t);
    var anchor = "middle";
    if (x - w / 2 < padL - 4) anchor = "start"; else if (x + w / 2 > W) anchor = "end";
    var lab = el("text", {class:"ax", x:x, y:H - 6, "text-anchor":anchor}, svg);
    lab.textContent = tk.t;
  }

  // area + line, broken at empty days
  var base = Y(Math.max(y0, Math.min(0, y1)));
  var seg = [];
  function flush(){
    if (!seg.length) return;
    if (seg.length === 1){
      el("circle", {cx:seg[0][0], cy:seg[0][1], r:2.5, fill:color}, svg);
    } else {
      var d = seg.map(function(p, k){ return (k ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("");
      el("path", {d: d + "L" + seg[seg.length-1][0].toFixed(1) + " " + base + "L" + seg[0][0].toFixed(1) + " " + base + "Z", fill:"url(#" + gid + ")"}, svg);
      el("path", {d:d, class:"ln", stroke:color}, svg);
    }
    seg = [];
  }
  vals.forEach(function(v, i){ if (v == null) flush(); else seg.push([X(i), Y(v)]); });
  flush();

  // right-axis line
  if (R){
    var rs = [];
    var rflush = function(){
      if (rs.length === 1) el("circle", {cx:rs[0][0], cy:rs[0][1], r:2.5, fill:R.color}, svg);
      else if (rs.length > 1) el("path", {d: rs.map(function(p, q){ return (q ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(""), class:"ln", stroke:R.color, "stroke-width":1.6}, svg);
      rs = [];
    };
    R.vals.forEach(function(v, i){ if (v == null) rflush(); else rs.push([X(i), YR(v)]); });
    rflush();
  }

  // emphasised endpoint
  var li = -1; for (var k = n - 1; k >= 0; k--){ if (vals[k] != null){ li = k; break; } }
  if (li >= 0) el("circle", {cx:X(li), cy:Y(vals[li]), r:4, fill:color, stroke:"var(--panel)", "stroke-width":2}, svg);
  if (R && li >= 0 && R.vals[li] != null) el("circle", {cx:X(li), cy:YR(R.vals[li]), r:4, fill:R.color, stroke:"var(--panel)", "stroke-width":2}, svg);

  // hover layer
  var cross = el("line", {class:"cross", y1:padT, y2:padT + ih, x1:-10, x2:-10, visibility:"hidden"}, svg);
  var dot = el("circle", {r:4.5, fill:color, stroke:"var(--panel)", "stroke-width":2, visibility:"hidden"}, svg);
  var dot2 = R ? el("circle", {r:4.5, fill:R.color, stroke:"var(--panel)", "stroke-width":2, visibility:"hidden"}, svg) : null;
  box._chart = {R:R, YR:R ? YR : null, dot2:dot2, X:X, Y:Y, n:n, padL:padL, iw:iw, vals:vals, days:days, view:view, m:m, cross:cross, dot:dot, color:color, li:li};
  svg.setAttribute("aria-label", m.name + "，" + md(days[0]) + " 至 " + md(days[n-1]) + " 每日走勢" + (li >= 0 ? "，最新 " + md(days[li]) + " " + fmtVal(m.fmt, vals[li]) : ""));
}

function buildCards(){

    card.className = "card"; card.id = "card-" + m.key;

      '<span class="tag ' + m.group + '">' + g.label + '</span></div>' +
      (m.right

          '<div class="vblock"><span class="vlabel"><i class="sw" style="background:' + m.right.color + '"></i>' + m.right.name + '（右軸）</span><span class="value value-b">—</span></div><span class="asof"></span></div>'
        : '<div class="value-row"><span class="value">—</span><span class="asof"></span></div>') +
      '<div class="compare"></div>' +
      '<div class="chart" tabindex="0"><svg role="img"></svg><div class="tip" hidden></div></div>';
    grid.appendChild(card);
    var box = card.querySelector(".chart");
    box.addEventListener("pointermove", function(e){ if (box._chart) syncShow(idxFromEvent(box, e)); });
    box.addEventListener("pointerdown", function(e){ if (box._chart) syncShow(idxFromEvent(box, e)); });
    // mouse: leaving the chart clears every chart; touch: keep the date pinned so you can scroll to the other charts
    box.addEventListener("pointerleave", function(e){ if (e.pointerType !== "touch") syncHide(); });
    box.addEventListener("focus", function(){ if (box._chart) syncShow(currentIdx(box)); });
    box.addEventListener("blur", function(e){
      var to = e.relatedTarget;
      if (!(to && to.classList && to.classList.contains("chart"))) syncHide();

    box.addEventListener("keydown", function(e){
      if (!box._chart) return;
      var i = currentIdx(box);

      else if (e.key === "ArrowRight"){ syncShow(i + 1); e.preventDefault(); }

}

};
function heatBin(t){ return Math.min(7, Math.max(0, Math.floor(t * 8))); }
function heatColor(t){ return HRAMP[heatS][heatBin(t)]; }
function fmtN(v){ return v == null ? "—" : Math.round(v).toLocaleString("en-US"); }
function fmtP(v){ return v == null ? "—" : (Number.isInteger(v) ? v.toLocaleString("en-US") : v.toLocaleString("en-US", {minimumFractionDigits:1, maximumFractionDigits:1})); }
function hhmm(h){ return pad(h) + ":00"; }
function slot(h){ return hhmm(h) + "–" + (h === 23 ? "24:00" : hhmm(h + 1)); }
function renderHeat(view){ heatView = view; drawHeat(); }
function heatCells(){
  var M = HMETH[heatM], cells = [], w, h;
  for (w = 0; w < 7; w++){ cells.push([]); for (h = 0; h < 24; h++) cells[w].push({vals:[], rec:-1, recD:null}); }
  heatUsed = 0;
  var off = HEAT_OFF[heatS], inn = HEAT_IN[M.inner];
  heatView.days.forEach(function(iso){
    var d = heat.byDay[iso]; if (!d) return;
    heatUsed++;
    var w = (new Date(toMs(iso)).getUTCDay() + 6) % 7;
    for (var h = 0; h < 24; h++){
      var st = d[h]; if (!st) continue;
      var v = st[off + inn], c = cells[w][h];
      if (v != null) c.vals.push(v);
      if (st[off + 2] != null && st[off + 2] > c.rec){ c.rec = st[off + 2]; c.recD = iso; }
    }
  });
  for (w = 0; w < 7; w++) for (h = 0; h < 24; h++){
    var c = cells[w][h];
    c.v = M.cross === "median" ? median(c.vals) : mean(c.vals);
    c.lo = c.vals.length ? Math.min.apply(0, c.vals) : null;
    c.hi = c.vals.length ? Math.max.apply(0, c.vals) : null;
  }
  return cells;
}
function drawHeat(){
  if (!heatReady()) return;
  var view = heatView, cells = heatCells(), col = HSER[heatS].color, M = HMETH[heatM], w, h;
  var mn = Infinity, mx = -Infinity, pk = null, lo = null;
  for (w = 0; w < 7; w++) for (h = 0; h < 24; h++){
    var v = cells[w][h].v; if (v == null) continue;
    if (v < mn){ mn = v; lo = [w, h]; } if (v > mx){ mx = v; pk = [w, h]; }
  }
  var dAvg = [], hAvg = [];
  for (w = 0; w < 7; w++) dAvg.push(mean(cells[w].map(function(c){ return c.v; }).filter(function(v){ return v != null; })));
  for (h = 0; h < 24; h++){ var a = []; for (w = 0; w < 7; w++) if (cells[w][h].v != null) a.push(cells[w][h].v); hAvg.push(mean(a)); }
  function arg(arr, best){ var k = -1; arr.forEach(function(v, i){ if (v != null && (k < 0 || (best ? v > arr[k] : v < arr[k]))) k = i; }); return k; }
  var bd = arg(dAvg, true), bh = arg(hAvg, true), ch = arg(hAvg, false);
  var dMax = Math.max.apply(0, dAvg.map(function(v){ return v || 0; })) || 1;

  var html = ['<div></div>'];
  for (h = 0; h < 24; h++) html.push('<div class="hh' + (h % 6 ? " x6" : "") + '">' + (h % 3 ? "" : pad(h)) + "</div>");
  html.push('<div class="hh cap">日均</div>');
  for (w = 0; w < 7; w++){
    html.push('<div class="hl' + (w === bd ? " best" : "") + '">' + HW[w] + "</div>");
    for (h = 0; h < 24; h++){
      var cv = cells[w][h].v, t = cv == null ? 0 : (mx > mn ? (cv - mn) / (mx - mn) : .5);
      var cls = "hc" + (pk && pk[0] === w && pk[1] === h ? " pk" : "") + (lo && lo[0] === w && lo[1] === h ? " lo" : "");
      html.push('<div class="' + cls + '" data-w="' + w + '" data-h="' + h + '" style="background:' + (cv == null ? "var(--grid)" : heatColor(t)) + '"></div>');
    }
    html.push('<div class="sd' + (w === bd ? " best" : "") + '"><span class="bw"><i style="width:' + Math.round((dAvg[w] || 0) / dMax * 100) + "%;background:" + col + '"></i></span><span class="v">' + fmtN(dAvg[w]) + "</span></div>");
  }
  html.push('<div class="hl cap">時均</div><div class="hcv" id="hcv"></div><div></div>');
  var hm = document.getElementById("hm");
  hm.innerHTML = html.join("");
  hm._cells = cells;
  drawCurve(hAvg, bh, ch, col);

  var d = view.days, cnt = cells.map(function(r){ return Math.max.apply(0, r.map(function(c){ return c.vals.length; })); }).filter(function(n){ return n > 0; });
  var cmin = Math.min.apply(0, cnt), cmax = Math.max.apply(0, cnt);
  document.getElementById("heat-desc").innerHTML = M.desc + ' <span class="use">→ ' + M.use + "</span>";
  document.getElementById("heat-basis").textContent = md(d[0]) + " → " + md(d[d.length - 1]) + " 共 " + heatUsed + " 天有在線資料 · 每格用 " + (cmin === cmax ? cmin : cmin + "–" + cmax) + " 天" +
    (heat.source === "snapshot" ? " · 快照資料" : "");
  document.getElementById("heat-sumhd").textContent = "結論 · 依「" + M.name + "」· " + HSER[heatS].label;
  document.getElementById("heat-sum").innerHTML = bd < 0 ? "" :
    '<div class="hs"><span class="k">人最多的一天</span><span class="v">' + HW[bd] + '</span><span class="s">日均 ' + fmtN(dAvg[bd]) + " 人</span></div>" +
    '<div class="hs"><span class="k">高峰時段</span><span class="v">' + slot(bh) + '</span><span class="s">時均 ' + fmtN(hAvg[bh]) + " 人</span></div>" +
    '<div class="hs"><span class="k">最冷時段</span><span class="v">' + slot(ch) + '</span><span class="s">時均 ' + fmtN(hAvg[ch]) + " 人</span></div>";
  var sws = HRAMP[heatS].map(function(c, k){
    var a = mn + (mx - mn) * k / 8, b = mn + (mx - mn) * (k + 1) / 8;
    return '<i style="background:' + c + '" title="' + fmtN(a) + "–" + fmtN(b) + ' 人"></i>';
  }).join("");
  document.getElementById("heat-legend").innerHTML = pk ?
    "<span>少 " + fmtN(mn) + '</span><span class="sws">' + sws + "</span><span>" + fmtN(mx) + " 人 多</span>" +
    '<span><i class="mk" style="box-shadow:inset 0 0 0 2px var(--bg);background:' + heatColor(1) + '"></i>最高格 ' + HW[pk[0]] + " " + hhmm(pk[1]) + "</span>" +
    '<span><i class="mk" style="box-shadow:inset 0 0 0 2px var(--ink-2);background:' + heatColor(0) + '"></i>最低格 ' + HW[lo[0]] + " " + hhmm(lo[1]) + "</span>" +
    '<span class="hint">游標移到格子上（手機點一下）看詳細</span>' : "";
  hideHeatTip();
}
function drawCurve(hAvg, bh, ch, col){
  var box = document.getElementById("hcv"); if (!box) return;
  var W = box.clientWidth, H = box.clientHeight, gap = parseFloat(getComputedStyle(document.getElementById("hm")).columnGap) || 3;
  var cw = (W - 23 * gap) / 24, top = 18, bot = 4;
  var mx = Math.max.apply(0, hAvg.map(function(v){ return v || 0; })) || 1;
  function X(i){ return i * (cw + gap) + cw / 2; }
  function Y(v){ return H - bot - (v / mx) * (H - top - bot); }
  var pts = [], i;
  for (i = 0; i < 24; i++) if (hAvg[i] != null) pts.push([X(i), Y(hAvg[i])]);
  if (!pts.length){ box.innerHTML = ""; return; }
  var line = pts.map(function(p, k){ return (k ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join("");
  var area = line + "L" + pts[pts.length - 1][0].toFixed(1) + "," + (H - bot) + "L" + pts[0][0].toFixed(1) + "," + (H - bot) + "Z";
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" aria-hidden="true"><defs><linearGradient id="hcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + col + '" stop-opacity=".28"/><stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>';
  s += '<line class="cg" x1="0" x2="' + W + '" y1="' + (H - bot) + '" y2="' + (H - bot) + '"/>';
  s += '<path d="' + area + '" fill="url(#hcg)"/><path class="cl" d="' + line + '" stroke="' + col + '"/>';
  [[bh, true], [ch, false]].forEach(function(o){
    var k = o[0]; if (k < 0) return;
    var x = X(k), y = Y(hAvg[k]), anchor = x < 30 ? "start" : x > W - 30 ? "end" : "middle";
    s += '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="' + (o[1] ? col : "var(--panel)") + '" stroke="' + col + '" stroke-width="1.5"/>';
    s += '<text class="cv" x="' + x + '" y="' + (y - 7) + '" text-anchor="' + anchor + '">' + fmtN(hAvg[k]) + "</text>";
  });
  box.innerHTML = s + "</svg>";
}
function showHeatTip(cell){
  var hm = document.getElementById("hm"), box = document.getElementById("heat-box"), tip = box.querySelector(".htip");
  var w = +cell.getAttribute("data-w"), h = +cell.getAttribute("data-h"), c = hm._cells[w][h], M = HMETH[heatM];
  var prev = hm.querySelector(".hc.on"); if (prev) prev.classList.remove("on");
  cell.classList.add("on");
  tip.innerHTML = '<div class="d">' + HW[w] + " " + slot(h) + "</div>" +
    '<div class="row"><span class="sw" style="background:' + HSER[heatS].color + '"></span><span class="k">' + HSER[heatS].label + " · " + M.name + "</span><b>" + fmtP(c.v) + "</b></div>" +
    (c.vals.length ? '<div class="muted">各天 ' + fmtP(c.lo) + "–" + fmtP(c.hi) + " · " + c.vals.length + " 天樣本</div>" +
      '<div class="muted">區間最高一分鐘 ' + fmtN(c.rec) + "（" + md(c.recD) + "）</div>" : '<div class="muted">這個區間沒有資料</div>');
  tip.hidden = false;
  var br = box.getBoundingClientRect(), cr = cell.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  var left = Math.max(0, Math.min(br.width - tw, cr.left - br.left + cr.width / 2 - tw / 2));
  var top = cr.top - br.top - th - 8; if (top < 0) top = cr.bottom - br.top + 8;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function hideHeatTip(){
  var prev = document.querySelector("#hm .hc.on"); if (prev) prev.classList.remove("on");
  document.querySelector("#heat-box .htip").hidden = true;
}
(function(){
  var hm = document.getElementById("hm");
  function pick(e){ var c = e.target.closest && e.target.closest(".hc"); if (c) showHeatTip(c); }
  hm.addEventListener("pointermove", pick);
  hm.addEventListener("pointerdown", pick);
  hm.addEventListener("pointerleave", function(e){ if (e.pointerType !== "touch") hideHeatTip(); });
  document.addEventListener("pointerdown", function(e){ if (!(e.target.closest && e.target.closest("#hm"))) hideHeatTip(); });
  function bindSeg(id, attr, set){
    document.querySelectorAll("#" + id + " button").forEach(function(b){
      b.addEventListener("click", function(){
        set(b.getAttribute(attr));
        document.querySelectorAll("#" + id + " button").forEach(function(o){ o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
        if (heatView) drawHeat();
      });
    });
  }
  bindSeg("heat-seg", "data-s", function(v){ heatS = v; });
  bindSeg("heat-meth", "data-m", function(v){ heatM = v; });
})();

/* ---------- wiring ---------- */
buildCards();
document.querySelectorAll(".seg button").forEach(function(b){
  b.addEventListener("click", function(){
    state.range = b.getAttribute("data-range");
    document.querySelectorAll(".seg button").forEach(function(o){ o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
    try { localStorage.setItem("ke7-range", state.range); } catch(e){}
    renderAll();
  });
});
document.getElementById("reload").addEventListener("click", function(){ load(); heatLoad(); });
document.addEventListener("pointerdown", function(e){
  if (hoverDay && !(e.target.closest && e.target.closest(".chart"))) syncHide();
});
/* ---------- 日期區間：一個日曆，先點開始、再點結束 ---------- */
var rp = {s:null, e:null, y:0, m:0, mode:"d", phase:"show", hov:null, curFrom:null, curTo:null};
function isoOf(y, m, d){ return y + "-" + pad2(m) + "-" + pad2(d); }
function slash(iso){ return iso.replace(/-/g, "/"); }
function spanDays(a, b){ return Math.round((toMs(b) - toMs(a)) / DAY) + 1; }
function rpSync(from, to){
  rp.curFrom = from; rp.curTo = to;
  document.getElementById("rp-label").textContent = slash(from) + " – " + slash(to);
  document.getElementById("rp-btn").classList.toggle("on", state.range === "custom");
}
function rpOpen(){
  if (!dateMin || !rp.curTo) return;
  rp.s = rp.curFrom; rp.e = rp.curTo; rp.phase = "show"; rp.hov = null; rp.mode = "d";
  rp.y = +rp.e.slice(0, 4); rp.m = +rp.e.slice(5, 7);
  var pop = document.getElementById("rp-pop");
  pop.style.left = "";
  pop.hidden = false; document.getElementById("rp-scrim").hidden = false;
  document.getElementById("rp-btn").setAttribute("aria-expanded", "true");
  rpDraw();
  if (window.innerWidth > 640){
    var r = pop.getBoundingClientRect();
    if (r.right > window.innerWidth - 8) pop.style.left = (pop.offsetLeft - (r.right - window.innerWidth + 8)) + "px";
  }
  var focus = pop.querySelector(".rp-days button.e") || pop.querySelector(".rp-days button:not(:disabled)");
  if (focus) focus.focus({preventScroll:true});
}
function rpClose(){
  document.getElementById("rp-pop").hidden = true; document.getElementById("rp-scrim").hidden = true;
  var b = document.getElementById("rp-btn"); b.setAttribute("aria-expanded", "false");
}
function rpDraw(){
  var body = document.getElementById("rp-body"), title = document.getElementById("rp-title");
  var prev = document.querySelector('#rp-pop [data-nav="-1"]'), next = document.querySelector('#rp-pop [data-nav="1"]');
  var y0 = +dateMin.slice(0, 4), m0 = +dateMin.slice(5, 7), y1 = +dateMax.slice(0, 4), m1 = +dateMax.slice(5, 7), h = "", i, m, d;
  if (rp.mode === "m"){
    title.textContent = rp.y + " 年";
    title.setAttribute("aria-label", "回到日期");
    prev.disabled = rp.y <= y0; next.disabled = rp.y >= y1;
    h = '<div class="rp-months">';
    for (m = 1; m <= 12; m++){
      var off = rp.y < y0 || (rp.y === y0 && m < m0) || rp.y > y1 || (rp.y === y1 && m > m1);
      h += '<button type="button" data-m="' + m + '"' + (m === rp.m ? ' class="cur"' : "") + (off ? " disabled" : "") + ">" + m + " 月</button>";
    }
    body.innerHTML = h + "</div>";
  } else {
    title.textContent = rp.y + " 年 " + rp.m + " 月";
    title.setAttribute("aria-label", rp.y + " 年 " + rp.m + " 月，點一下改選年份與月份");
    prev.disabled = rp.y < y0 || (rp.y === y0 && rp.m <= m0);
    next.disabled = rp.y > y1 || (rp.y === y1 && rp.m >= m1);
    var lo = rp.s, hi = rp.phase === "end" ? (rp.hov || rp.s) : rp.e;
    if (lo && hi && hi < lo){ var t = lo; lo = hi; hi = t; }
    var first = new Date(Date.UTC(rp.y, rp.m - 1, 1)).getUTCDay(), nd = new Date(Date.UTC(rp.y, rp.m, 0)).getUTCDate();
    h = '<div class="rp-wk" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="rp-days">';
    for (i = 0; i < first; i++) h += "<span></span>";
    for (d = 1; d <= nd; d++){
      var iso = isoOf(rp.y, rp.m, d), cls = [];
      if (lo && hi && iso >= lo && iso <= hi) cls.push("in");
      if (iso === lo) cls.push("s");
      if (iso === hi) cls.push("e");
      h += '<button type="button" data-d="' + iso + '"' + (cls.length ? ' class="' + cls.join(" ") + '"' : "") +
        ' aria-label="' + rp.m + " 月 " + d + " 日 " + WD[new Date(toMs(iso)).getUTCDay()] + '"' +
        (iso < dateMin || iso > dateMax ? " disabled" : "") + ">" + d + "</button>";
    }
    body.innerHTML = h + "</div>";
  }
  document.getElementById("rp-hint").textContent =
    rp.phase === "end" ? "② 再點結束日期" : rp.phase === "done" ? "✓ 選好了，按「套用」更新圖表" : "① 點開始日期";
  document.getElementById("rp-sel").textContent = rp.phase === "end"
    ? slash(rp.s) + " → ？"
    : slash(rp.s) + " → " + slash(rp.e) + " · " + spanDays(rp.s, rp.e) + " 天";
  document.getElementById("rp-ok").disabled = rp.phase !== "done";
}
function rpPick(iso){
  if (rp.phase !== "end"){ rp.s = iso; rp.e = null; rp.phase = "end"; }
  else { if (iso < rp.s){ rp.e = rp.s; rp.s = iso; } else rp.e = iso; rp.phase = "done"; }
  rp.hov = null;
  rpDraw();
  var f = document.querySelector('#rp-body [data-d="' + iso + '"]'); if (f) f.focus({preventScroll:true});
}
function rpApply(){
  if (rp.phase !== "done") return;
  state.range = "custom"; state.from = rp.s; state.to = rp.e;
  document.querySelectorAll(".seg button").forEach(function(o){ o.setAttribute("aria-pressed", "false"); });
  rpClose();
  document.getElementById("rp-btn").focus({preventScroll:true});
  renderAll();
}
document.getElementById("rp-btn").addEventListener("click", function(){
  if (document.getElementById("rp-pop").hidden) rpOpen(); else rpClose();
});
document.getElementById("rp-scrim").addEventListener("click", rpClose);
document.getElementById("rp-cancel").addEventListener("click", function(){ rpClose(); document.getElementById("rp-btn").focus({preventScroll:true}); });
document.getElementById("rp-ok").addEventListener("click", rpApply);
document.getElementById("rp-title").addEventListener("click", function(){ rp.mode = rp.mode === "d" ? "m" : "d"; rpDraw(); });
document.querySelectorAll("#rp-pop [data-nav]").forEach(function(b){
  b.addEventListener("click", function(){
    var k = +b.getAttribute("data-nav");
    if (rp.mode === "m") rp.y += k;
    else { rp.m += k; if (rp.m < 1){ rp.m = 12; rp.y--; } if (rp.m > 12){ rp.m = 1; rp.y++; } }
    rpDraw();
  });
});
var rpBody = document.getElementById("rp-body");
rpBody.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest("button"); if (!b || b.disabled) return;
  if (b.hasAttribute("data-m")){ rp.m = +b.getAttribute("data-m"); rp.mode = "d"; rpDraw(); return; }
  rpPick(b.getAttribute("data-d"));
});
rpBody.addEventListener("mouseover", function(e){
  if (rp.phase !== "end") return;
  var b = e.target.closest && e.target.closest("button[data-d]"); if (!b || b.disabled) return;
  var iso = b.getAttribute("data-d"); if (iso === rp.hov) return;
  rp.hov = iso; rpDraw();
});
document.getElementById("rp-pop").addEventListener("keydown", function(e){
  if (e.key === "Escape"){ rpClose(); document.getElementById("rp-btn").focus({preventScroll:true}); }
});
try {
  var saved = localStorage.getItem("ke7-range");
  if (saved === "90" || saved === "30"){ var sb = document.getElementById("range-" + saved); if (sb) sb.click(); }
} catch(e){}

var rt;
if ("ResizeObserver" in window){
  var ro = new ResizeObserver(function(){ clearTimeout(rt); rt = setTimeout(renderAll, 80); });
  ro.observe(document.getElementById("grid"));
} else window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(renderAll, 80); });

// 先用快照畫好，再嘗試讀即時資料
state.rows = readSnapshot(); state.source = "snapshot";
renderAll();
load();
heatLoad();
})();
